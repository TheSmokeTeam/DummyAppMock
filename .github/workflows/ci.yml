name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-smoke-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DummyAppMock.sln --configfile NuGet.config

      - name: Build
        run: dotnet build DummyAppMock.sln -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Docker image
        run: docker build -t dummyappmock-sample .

      - name: Smoke sample
        shell: bash
        run: |
          container_id="$(docker run -d -p 18080:8080 dummyappmock-sample)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          response=""
          for attempt in {1..15}; do
            if response="$(curl --silent --show-error --fail http://127.0.0.1:18080/data)"; then
              break
            fi

            sleep 2
          done

          if [[ -z "$response" ]]; then
            echo "DummyAppMock did not serve /data in time."
            exit 1
          fi

          if [[ "$response" != *"hello from DummyAppMock"* ]]; then
            echo "Unexpected /data response: $response"
            exit 1
          fi
